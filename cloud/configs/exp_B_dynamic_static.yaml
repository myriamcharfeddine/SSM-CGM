# Experiment B: Dynamic + Static Features
# Same cohort and window-level split as Experiment A.
# Only difference: additional static clinical/demographic/medication covariates.

experiment: B
name: dynamic_plus_static
description: >
  SSM-CGM with original 29 dynamic features + static clinical covariates.
  Goal: measure uplift from enriched features vs. Experiment A baseline.

# ── Paths ──────────────────────────────────────────────────────────────────────
paths:
  train_feather:       Data/ssmcgm_ready_enriched/train_timeseries_static.feather
  test_feather:        Data/ssmcgm_ready_enriched/test_timeseries_static.feather
  static_feature_list: Data/ssmcgm_ready_enriched/static_feature_list.json
  output_full:         Data/results/exp_B_full
  output_smoke:        Data/results/exp_B_smoke

# ── Model hyperparameters (same as Experiment A) ───────────────────────────────
windows:
  context_length: 288      # 24h at 5-min intervals
  horizon:        12       # 1h forecast

model:
  hidden_size: 128
  dropout:     0.20
  encoder:
    mamba_depth: 4
    dropout:     0.20
    mamba_kwargs:
      d_state:  128
      d_conv:   4
      expand:   4
      dt_rank:  null
  post_static:
    mamba_depth: 1
    dropout:     0.20
    mamba_kwargs:
      d_state:  128
      d_conv:   4
      expand:   4
      dt_rank:  null

loss:
  type:      QuantileLoss
  quantiles: [0.1, 0.5, 0.9]

optim:
  type:         AdamW
  lr:           0.001
  betas:        [0.9, 0.95]
  weight_decay: 0.0005

scheduler:
  type:    ReduceLROnPlateau
  patience: 15
  factor:   0.2
  min_lr:   0.00001
  monitor:  val_loss
  mode:     min

training:
  epochs:            30
  devices:           1
  gradient_clip_val: 1.0
  strategy:          auto
  val_check_interval: 0.2

dataloader:
  batch_size:          32
  num_workers:         4
  persistent_workers:  true
  pin_memory:          true

# ── Smoke test overrides ───────────────────────────────────────────────────────
smoke:
  n_participants:      200
  epochs:              3
  val_check_interval:  1.0

# ── Comparison target ──────────────────────────────────────────────────────────
comparison:
  exp_A_results: Data/results/smoke/results_dynamic_only.csv
  exp_B_results: Data/results/exp_B_smoke/results_dynamic_static.csv
  metrics:       [rmse, mae, tir_70_180_pct]
